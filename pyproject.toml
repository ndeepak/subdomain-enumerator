[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subdomain-enumerator"
version = "0.1.0"
description = "Passive subdomain discovery using certificate transparency and optional API sources"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Subdomain Enumerator Contributors" }
]
keywords = ["security", "subdomains", "enumeration", "reconnaissance", "crt-sh"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "requests>=2.31.0",
  "urllib3>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/ndeepak/subdomain-enumerator"
Repository = "https://github.com/ndeepak/subdomain-enumerator"
Issues = "https://github.com/ndeepak/subdomain-enumerator/issues"

[project.scripts]
subdomain-enumerator = "getSubDomains:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
